{% extends "base.html" %}
{% block title %}Create workspace{% endblock %}
{% block auth_content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-brand-dark to-slate-900 px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="inline-flex w-10 h-10 rounded-lg bg-brand items-center justify-center text-white font-bold mb-3">L</div>
      <h1 class="text-white text-xl font-semibold">Create your LOOP workspace</h1>
      <p class="text-white/50 text-sm mt-1">You'll be the workspace Admin.</p>
    </div>
    <div class="bg-white rounded-xl p-6 shadow-xl">
      {% if error %}<div class="mb-4 text-sm bg-red-50 text-red-700 px-3 py-2 rounded-lg">{{ error }}</div>{% endif %}
      <form method="post" action="/signup" class="space-y-3">
        <div>
          <label class="text-xs font-medium text-slate-500">Company / workspace name</label>
          <input type="text" name="workspace_name" required placeholder="Acme Inc">
        </div>
        <div>
          <label class="text-xs font-medium text-slate-500">Your name</label>
          <input type="text" name="name" required placeholder="Jane Doe">
        </div>
        <div>
          <label class="text-xs font-medium text-slate-500">Email</label>
          <input type="email" name="email" required placeholder="jane@acme.com">
        </div>
        <div>
          <label class="text-xs font-medium text-slate-500">Password</label>
          <input type="password" name="password" required minlength="8" placeholder="At least 8 characters">
        </div>
        <button class="btn btn-primary w-full justify-center" type="submit">Create workspace</button>
      </form>
      <p class="text-xs text-slate-500 mt-4 text-center">Already have an account? <a href="/login" class="text-brand font-medium">Log in</a></p>
    </div>
  </div>
</div>
{% endblock %}
