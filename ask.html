{% extends "base.html" %}
{% block title %}Ask LOOP{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-1">Ask LOOP</h1>
<p class="text-slate-500 text-sm mb-6">Ask a plain-English question. Answers are grounded in your actual feedback — every claim is backed by a real item.</p>

<div class="card mb-4">
  <form id="ask-form" class="flex gap-2">
    <input type="text" id="question" placeholder="What are users saying about onboarding?" class="flex-1" required>
    <button class="btn btn-primary" type="submit">Ask</button>
  </form>
  <div class="flex gap-2 mt-3 text-xs text-slate-500">
    <span>Try:</span>
    <button type="button" class="underline" onclick="ask('What are the most common complaints about billing?')">billing complaints</button>
    <button type="button" class="underline" onclick="ask('Is sentiment about the mobile experience improving?')">mobile sentiment</button>
  </div>
</div>

<div id="results" class="space-y-4"></div>

<script>
const form = document.getElementById('ask-form');
form.addEventListener('submit', (e) => { e.preventDefault(); ask(document.getElementById('question').value); });

async function ask(question) {
  document.getElementById('question').value = question;
  const results = document.getElementById('results');
  const box = document.createElement('div');
  box.className = 'card';
  box.innerHTML = `<div class="font-medium mb-2">${question}</div><div class="text-slate-400 text-sm">Thinking…</div>`;
  results.prepend(box);

  const res = await fetch('/api/ask', {
    method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: `question=${encodeURIComponent(question)}`
  });
  const data = await res.json();
  const sourcesHtml = data.sources.map((s,i) =>
    `<div class="border-t pt-2 mt-2 text-xs text-slate-500"><span class="font-mono text-slate-400">[${i+1}]</span> ${s.content}</div>`
  ).join('');
  box.innerHTML = `<div class="font-medium mb-2">${question}</div>
    <div class="text-sm whitespace-pre-wrap">${data.answer}</div>
    ${sourcesHtml ? `<div class="mt-3"><div class="text-xs uppercase text-slate-400 font-medium">Sources</div>${sourcesHtml}</div>` : ''}`;
}
</script>
{% endblock %}
